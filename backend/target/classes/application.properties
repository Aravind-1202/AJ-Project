server.port=8080

# Spring Application Name
spring.application.name=nexatech-backend

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/nexatech_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root9940

# JPA / Hibernate Auto DDL & SQL logging
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.com.nexatech=DEBUG
logging.level.org.springframework.web=INFO

